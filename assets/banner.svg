<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      /* Dynamic Flight Path Animations */
      @keyframes floatFlight {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(15px, -10px) rotate(1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes dashRoute {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      
      .animated-flight { animation: floatFlight 6s ease-in-out infinite; }
      .animated-route { stroke-dasharray: 8, 8; animation: dashRoute 20s linear infinite; }
      .animated-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Mesh Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic / Background Decorative Aviation Graphics (Behind Foreground Text) -->
  <!-- Flight Radar Circles -->
  <g transform="translate(980, 180)" class="animated-pulse">
    <circle r="140" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" />
    <circle r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" />
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
    <circle r="6" fill="#38bdf8" />
  </g>

  <!-- Flight Path Lines -->
  <path d="M 100 280 Q 400 80, 950 180" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" />
  <path d="M 100 280 Q 400 80, 950 180" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-route" opacity="0.8" />

  <path d="M 200 320 Q 600 120, 1100 100" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,6" opacity="0.3" />

  <!-- Dynamic Airplane Icon in Background Graphic Zone -->
  <g class="animated-flight" transform="translate(940, 165)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#38bdf8" transform="scale(1.8) rotate(45)" />
  </g>

  <!-- Content Pill / Badge -->
  <g transform="translate(80, 60)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="16" y="21" class="badge-text">✈️ AIRLINE OPS &amp; DISPATCH</text>
  </g>

  <!-- Foreground Main Title and Subtitle (Guaranteed Unobscured) -->
  <text x="80" y="145" class="title">Awesome Flight Scheduling</text>
  <text x="80" y="195" class="subtitle">Curated Flight Operations, Crew Pairing, &amp; Dispatch Platforms</text>

  <!-- Accent Line under Title -->
  <rect x="80" y="225" width="480" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Secondary Metrics / Tags -->
  <g transform="translate(80, 260)" opacity="0.85">
    <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14 font-weight="500">
      ⚡ Commercial SaaS &nbsp;|&nbsp; 🌐 Open-Source Systems &nbsp;|&nbsp; 🛫 Dispatch &amp; Crew Rostering
    </text>
  </g>
</svg>
